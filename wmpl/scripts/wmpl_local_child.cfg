[mode]
# if mode is 'master' then the [children] and [capacity] list the child processing nodes and capacity of each
# if mode is 'child' then the [sftp] section explain how the child will connect to the parent.

mode = child

# details of the child nodes. Each line must have three values separated by commas
# * list of folders that each node will use. These must map to each node's sftp user's homedir. 
# * capacity - number of candidates or trajetories to solve. Allows loadbalancing
# * operation mode - 0: disabled, 1: candidates, 2: phase1
# the node names can be used to differentiate children

[children]
node1 = c:/temp/wmpl/node1,20,1
node2 = c:/temp/wmpl/node2,40,1


[sftp]
# sftp login details for clients to connect to the parent
# if the port is nonstandard (ie not 22) then uncomment and set as required
host = localhost
user = mark
key = ~/.ssh/pikey
#port=2222